# Build the static site and publish it to GitHub Pages (free for public repositories).
# Repository settings: Pages -> Source: "GitHub Actions".
# With a custom domain (recommended), set the repository variable SITE_URL, e.g.
# https://lendocr.com. Without one, set SITE_URL=https://<user>.github.io and
# BASE_PATH=/lendocr-website.
name: Deploy

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npx astro check
      # Builds the site, validates every page's HTML, and runs tests/site.test.mjs
      # (links, SEO tags, sitemap, privacy, contrast). Nothing deploys if any fail.
      - run: npm test
        env:
          SITE_URL: ${{ vars.SITE_URL || 'https://lendocr.com' }}
          BASE_PATH: ${{ vars.BASE_PATH || '/' }}
          PUBLIC_GOOGLE_SITE_VERIFICATION: ${{ vars.GOOGLE_SITE_VERIFICATION }}
      - uses: actions/upload-pages-artifact@v4
        with:
          path: dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
